name: Coach backend CI

on:
  push:
    branches: [main, feature/coach-qwen-backend]
  pull_request:

jobs:
  coach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/coach_routes.py coach_server.py
